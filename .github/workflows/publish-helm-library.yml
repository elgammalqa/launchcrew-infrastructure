name: Publish Helm Library Chart

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'helm/flwcre-library/**'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'helm/flwcre-library/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CHART_NAME: flwcre-library

jobs:
  lint-and-test:
    name: Lint and Test Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 3.13.0

      - name: Lint chart
        run: |
          helm lint helm/flwcre-library

  package-and-publish:
    name: Package and Publish Chart
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 3.13.0

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine chart version
        id: version
        run: |
          CURRENT_VERSION=$(grep '^version:' helm/flwcre-library/Chart.yaml | awk '{print $2}')
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Publishing chart version: $CURRENT_VERSION"

      - name: Package chart
        run: |
          helm package helm/flwcre-library --destination ./charts

      - name: Push chart to OCI registry
        run: |
          helm push ./charts/${{ env.CHART_NAME }}-${{ steps.version.outputs.version }}.tgz \
            oci://${{ env.REGISTRY }}/flwcrecom/helm-charts

      - name: Verify chart push
        run: |
          helm pull oci://${{ env.REGISTRY }}/flwcrecom/helm-charts/${{ env.CHART_NAME }} \
            --version ${{ steps.version.outputs.version }}
          echo "✅ Chart successfully published and verified"