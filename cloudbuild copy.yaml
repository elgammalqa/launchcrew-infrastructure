# Modern CI/CD Cloud Build configuration for AI Agents service
# Following GCP reference architecture best practices

substitutions:
  _IMAGE_NAME: ai-agents
  _IMAGE_REPO: gcr.io/alien-drake-474816-a2
  _DEPLOY_REGION: us-central1
  _CLUSTER_NAME: dev-gke-cluster

steps:
  # Step 1: Build and tag container image with git commit ID
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Modern tagging strategy: environment-gitcommit
        BRANCH_NAME=${BRANCH_NAME:-dev}
        SHORT_SHA=${SHORT_SHA}
        
        # Validate required variables
        if [[ -z "$SHORT_SHA" ]]; then
          echo "ERROR: SHORT_SHA is required for proper image tagging"
          exit 1
        fi
        
        # Create semantic tags using built-in variables
        echo "Building image with modern CI/CD tagging:"
        echo "  Branch: $BRANCH_NAME"
        echo "  Commit: $SHORT_SHA"
        echo "  Primary tag: $BRANCH_NAME-$SHORT_SHA"
        echo "  Latest tag: $BRANCH_NAME-latest"
        
        # Build with multiple tags for different use cases
        docker build \
          --build-arg BUILD_VERSION="$BRANCH_NAME-$SHORT_SHA" \
          --build-arg BUILD_COMMIT="$SHORT_SHA" \
          --build-arg BUILD_BRANCH="$BRANCH_NAME" \
          -t ${_IMAGE_REPO}/${_IMAGE_NAME}:$BRANCH_NAME-$SHORT_SHA \
          -t ${_IMAGE_REPO}/${_IMAGE_NAME}:$BRANCH_NAME-latest \
          .
        
        # Push all tags
        docker push ${_IMAGE_REPO}/${_IMAGE_NAME}:$BRANCH_NAME-$SHORT_SHA
        docker push ${_IMAGE_REPO}/${_IMAGE_NAME}:$BRANCH_NAME-latest
        
        echo "Successfully built and pushed:"
        echo "  ${_IMAGE_REPO}/${_IMAGE_NAME}:$BRANCH_NAME-$SHORT_SHA"
        echo "  ${_IMAGE_REPO}/${_IMAGE_NAME}:$BRANCH_NAME-latest"
        
        # Store image tag for Cloud Deploy
        echo "$BRANCH_NAME-$SHORT_SHA" > /workspace/image-tag.txt
    id: 'build-and-push'

  # Step 2: Verify build success and prepare for deployment
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Read the image tag
        tag_from_file=$(cat /workspace/image-tag.txt)
        
        echo "Build completed successfully with image tag: $tag_from_file"
        echo "Image available at: ${_IMAGE_REPO}/${_IMAGE_NAME}:$tag_from_file"
        
        # Verify image exists
        gcloud container images describe ${_IMAGE_REPO}/${_IMAGE_NAME}:$tag_from_file
        
        echo "✅ Build and push completed successfully"
    id: 'verify-build'
    waitFor: ['build-and-push']

# Build configuration
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

# Region configuration - ensure builds run in us-central1
# Note: Cloud Build region is set at trigger level, not in cloudbuild.yaml
# Verify trigger is configured for us-central1 region

# Build timeout (increased for tests)
timeout: '2400s'
