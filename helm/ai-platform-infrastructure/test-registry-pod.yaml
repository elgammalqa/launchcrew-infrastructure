apiVersion: v1
kind: Pod
metadata:
  name: registry-test
  namespace: ai-platform-infra
spec:
  containers:
  - name: docker
    image: docker:24-dind
    securityContext:
      privileged: true
    env:
    - name: DOCKER_TLS_CERTDIR
      value: ""
    command: ["/bin/sh"]
    args: ["-c", "dockerd-entrypoint.sh & sleep 10 && docker pull hello-world && docker tag hello-world registry:5000/hello-world:test && docker push registry:5000/hello-world:test && sleep 3600"]
  restartPolicy: Never