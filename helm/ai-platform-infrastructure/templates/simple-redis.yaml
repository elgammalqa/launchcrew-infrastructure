{{- if and .Values.simpleServices (and .Values.simpleServices.redis .Values.simpleServices.redis.enabled) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ai-platform.fullname" . }}-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: redis
    app: redis
    app: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-platform.selectorLabels" . | nindent 6 }}
      component: redis
      app: redis
    app: redis
  template:
    metadata:
      labels:
        {{- include "ai-platform.selectorLabels" . | nindent 8 }}
        component: redis
        app: redis
    app: redis
    spec:
      containers:
      - name: redis
        image: {{ .Values.simpleServices.redis.image }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.simpleServices.redis.port }}
          name: redis
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        command: ["redis-server"]
        args: ["--requirepass", "$(REDIS_PASSWORD)"]
        resources:
          {{- toYaml .Values.simpleServices.redis.resources | nindent 10 }}
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        {{- include "ai-platform.labels" . | nindent 8 }}
        component: redis
        app: redis
    app: redis
    spec:
      accessModes:
        - {{ .Values.persistence.redis.accessMode }}
      resources:
        requests:
          storage: {{ .Values.persistence.redis.size }}
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: redis
    app: redis
    app: redis
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.simpleServices.redis.port }}
    targetPort: redis
    protocol: TCP
    name: redis
  selector:
    {{- include "ai-platform.selectorLabels" . | nindent 4 }}
    component: redis
    app: redis
    app: redis
{{- end }}