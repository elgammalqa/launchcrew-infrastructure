{{- if .Values.keda.enabled }}
---
# KubeRay Operator - Cron based scaling
{{- if index .Values "kuberay-operator" "scaleToZero" }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kuberay-operator-scaler
  namespace: {{ .Values.global.namespace }}
spec:
  scaleTargetRef:
    name: kuberay-operator
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 300
  triggers:
  - type: cron
    metadata:
      timezone: America/Chicago
      start: 0 7 * * *
      end: 0 21 * * *
      desiredReplicas: "1"
{{- end }}
---
# Note: StatefulSets (PostgreSQL, Redis, Weaviate) cannot be scaled by KEDA cron triggers
# They maintain persistent state and should remain running
# Only Deployments (RabbitMQ, NATS) can be scaled down outside working hours

# RabbitMQ - Cron based
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "ai-platform.fullname" . }}-rabbitmq-scaler
  namespace: {{ .Values.global.namespace }}
spec:
  scaleTargetRef:
    name: {{ include "ai-platform.fullname" . }}-rabbitmq
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 300
  triggers:
  - type: cron
    metadata:
      timezone: America/Chicago
      start: 0 7 * * *
      end: 0 21 * * *
      desiredReplicas: "1"
---
# NATS - Cron based
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
