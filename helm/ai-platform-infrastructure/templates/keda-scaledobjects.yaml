{{- if .Values.keda.enabled }}
---
# KubeRay Operator - Cron based scaling
{{- if index .Values "kuberay-operator" "scaleToZero" }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kuberay-operator-scaler
  namespace: {{ .Values.global.namespace }}
spec:
  scaleTargetRef:
    name: kuberay-operator
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 300
  triggers:
  - type: cron
    metadata:
      timezone: America/Chicago
      start: 0 7 * * *
      end: 0 21 * * *
      desiredReplicas: "1"
{{- end }}
---
