{{- if and .Values.simpleServices (and .Values.simpleServices.postgresql .Values.simpleServices.postgresql.enabled) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ai-platform.fullname" . }}-postgresql
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: postgresql
    app: postgresql
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-platform.selectorLabels" . | nindent 6 }}
      component: postgresql
      app: postgresql
  template:
    metadata:
      labels:
        {{- include "ai-platform.selectorLabels" . | nindent 8 }}
        component: postgresql
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: {{ .Values.simpleServices.postgresql.image }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.simpleServices.postgresql.port }}
          name: postgresql
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          {{- toYaml .Values.simpleServices.postgresql.resources | nindent 10 }}
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        {{- include "ai-platform.labels" . | nindent 8 }}
        component: postgresql
        app: postgresql
    spec:
      accessModes:
        - {{ .Values.persistence.postgresql.accessMode }}
      resources:
        requests:
          storage: {{ .Values.persistence.postgresql.size }}
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: postgresql
    app: postgresql
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.simpleServices.postgresql.port }}
    targetPort: postgresql
    protocol: TCP
    name: postgresql
  selector:
    {{- include "ai-platform.selectorLabels" . | nindent 4 }}
    component: postgresql
    app: postgresql
{{- end }}