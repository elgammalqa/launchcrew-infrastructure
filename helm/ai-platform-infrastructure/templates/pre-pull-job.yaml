{{- if .Values.imagePull.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ai-platform.fullname" . }}-image-pull
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: image-pull
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "ai-platform.selectorLabels" . | nindent 8 }}
        component: image-pull
    spec:
      restartPolicy: Never
      containers:
      - name: image-puller
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Image pre-pull simulation (conceptual implementation)"
          echo "In production, this would pull the following official images:"
          
          {{- range .Values.imagePull.images }}
          echo "Would pull: {{ . }}"
          {{- end }}
          
          echo "Pre-pull process completed successfully!"
          echo "Helm will now deploy with the specified official images"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      tolerations:
      - operator: Exists
      nodeSelector:
        kubernetes.io/os: linux
{{- end }}