{{- if .Values.secrets }}
# PostgreSQL Secret
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: postgresql
type: Opaque
data:
  POSTGRES_DB: {{ .Values.secrets.postgresql.database | b64enc }}
  POSTGRES_USER: {{ .Values.secrets.postgresql.username | b64enc }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresql.password | b64enc }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@postgresql:5432/%s" .Values.secrets.postgresql.username .Values.secrets.postgresql.password .Values.secrets.postgresql.database | b64enc }}
---
# Redis Secret
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: redis
type: Opaque
data:
  REDIS_PASSWORD: {{ .Values.secrets.redis.password | b64enc }}
  REDIS_URL: {{ printf "redis://:%s@redis:6379" .Values.secrets.redis.password | b64enc }}
---
# RabbitMQ Secret
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: rabbitmq
type: Opaque
data:
  RABBITMQ_DEFAULT_USER: {{ .Values.secrets.rabbitmq.username | b64enc }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.secrets.rabbitmq.password | b64enc }}
  RABBITMQ_URL: {{ printf "amqp://%s:%s@rabbitmq:5672" .Values.secrets.rabbitmq.username .Values.secrets.rabbitmq.password | b64enc }}
---
# ClickHouse Secret
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: clickhouse
type: Opaque
data:
  CLICKHOUSE_DB: {{ .Values.secrets.clickhouse.database | b64enc }}
  CLICKHOUSE_USER: {{ .Values.secrets.clickhouse.username | b64enc }}
  CLICKHOUSE_PASSWORD: {{ .Values.secrets.clickhouse.password | b64enc }}
  CLICKHOUSE_URL: {{ printf "http://%s:%s@clickhouse:8123/%s" .Values.secrets.clickhouse.username .Values.secrets.clickhouse.password .Values.secrets.clickhouse.database | b64enc }}
---
# InfluxDB Secret
apiVersion: v1
kind: Secret
metadata:
  name: influxdb-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: influxdb
type: Opaque
data:
  DOCKER_INFLUXDB_INIT_USERNAME: {{ .Values.secrets.influxdb.username | b64enc }}
  DOCKER_INFLUXDB_INIT_PASSWORD: {{ .Values.secrets.influxdb.password | b64enc }}
  DOCKER_INFLUXDB_INIT_ORG: {{ .Values.secrets.influxdb.organization | b64enc }}
  DOCKER_INFLUXDB_INIT_BUCKET: {{ .Values.secrets.influxdb.bucket | b64enc }}
  DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: {{ .Values.secrets.influxdb.token | b64enc }}
  INFLUXDB_URL: {{ "http://influxdb:8086" | b64enc }}
---
# Qdrant Secret
apiVersion: v1
kind: Secret
metadata:
  name: qdrant-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: qdrant
type: Opaque
data:
  QDRANT_API_KEY: {{ .Values.secrets.qdrant.apiKey | b64enc }}
  QDRANT_URL: {{ "http://qdrant:6333" | b64enc }}
---
# Docker Registry Secret
apiVersion: v1
kind: Secret
metadata:
  name: registry-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: registry
type: Opaque
data:
  REGISTRY_HTTP_SECRET: {{ .Values.secrets.registry.httpSecret | b64enc }}
  REGISTRY_URL: {{ "http://registry:5000" | b64enc }}
---
# NATS Secret
apiVersion: v1
kind: Secret
metadata:
  name: nats-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: nats
type: Opaque
data:
  NATS_URL: {{ "nats://nats:4222" | b64enc }}
---
# Ray Secret
apiVersion: v1
kind: Secret
metadata:
  name: ray-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: ray
type: Opaque
data:
  RAY_HEAD_SERVICE_HOST: {{ "ray-cluster-dev-head-svc" | b64enc }}
  RAY_DASHBOARD_URL: {{ "http://ray-cluster-dev-head-svc:8265" | b64enc }}
{{- end }}