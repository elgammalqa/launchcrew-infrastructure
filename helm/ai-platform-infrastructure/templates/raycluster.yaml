{{- if index .Values "kuberay-operator" "enabled" }}
---
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-cluster-dev
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: ray
    app.kubernetes.io/component: cluster
    app.kubernetes.io/part-of: ai-platform
spec:
  # Ray version
  rayVersion: '2.49.0'
  
  # Head node configuration
  headGroupSpec:
    serviceType: ClusterIP
    rayStartParams:
      dashboard-host: '0.0.0.0'
      port: '6379'
      num-cpus: '{{ .Values.rayCluster.head.numCpus }}'
      block: 'true'
    template:
      spec:
        containers:
        - name: ray-head
          image: {{ .Values.rayCluster.head.image.repository }}:{{ .Values.rayCluster.head.image.tag }}
          imagePullPolicy: {{ .Values.rayCluster.head.image.pullPolicy }}
          ports:
          - containerPort: 10001
            name: client
          - containerPort: 6379
            name: gcs
          - containerPort: 8265
            name: dashboard
          resources:
            {{- toYaml .Values.rayCluster.head.resources | nindent 12 }}
          env:
          - name: PYTHONPATH
            value: "/app"
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: postgresql-secret
                key: DATABASE_URL
          - name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: redis-secret
                key: REDIS_URL
          - name: NATS_URL
            value: "nats://nats.{{ .Values.global.namespace }}.svc.cluster.local:4222"
          - name: RABBITMQ_URL
            value: "amqp://rabbitmq.{{ .Values.global.namespace }}.svc.cluster.local:5672"
          - name: QDRANT_URL
            value: "http://qdrant.{{ .Values.global.namespace }}.svc.cluster.local:6333"
          - name: CLICKHOUSE_URL
            value: "http://clickhouse.{{ .Values.global.namespace }}.svc.cluster.local:8123"
          - name: INFLUXDB_URL
            value: "http://influxdb.{{ .Values.global.namespace }}.svc.cluster.local:8086"
          {{- if .Values.rayCluster.env.openaiApiKey }}
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: ai-platform-secrets
                key: openai-api-key
                optional: true
          {{- end }}
          {{- if .Values.rayCluster.env.anthropicApiKey }}
          - name: ANTHROPIC_API_KEY
            valueFrom:
              secretKeyRef:
                name: ai-platform-secrets
                key: anthropic-api-key
                optional: true
          {{- end }}
          volumeMounts:
          - name: log-volume
            mountPath: /tmp/ray
        volumes:
        - name: log-volume
          emptyDir: {}
  
  # Worker nodes configuration
  workerGroupSpecs:
  - replicas: {{ .Values.rayCluster.worker.replicas }}
    minReplicas: {{ .Values.rayCluster.worker.minReplicas }}
    maxReplicas: {{ .Values.rayCluster.worker.maxReplicas }}
    groupName: worker-group
    rayStartParams:
      num-cpus: '{{ .Values.rayCluster.worker.numCpus }}'
      block: 'true'
    template:
      spec:
        containers:
        - name: ray-worker
          image: {{ .Values.rayCluster.worker.image.repository }}:{{ .Values.rayCluster.worker.image.tag }}
          imagePullPolicy: {{ .Values.rayCluster.worker.image.pullPolicy }}
          resources:
            {{- toYaml .Values.rayCluster.worker.resources | nindent 12 }}
          env:
          - name: PYTHONPATH
            value: "/app"
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: postgresql-secret
                key: DATABASE_URL
          - name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: redis-secret
                key: REDIS_URL
          - name: NATS_URL
            value: "nats://nats.{{ .Values.global.namespace }}.svc.cluster.local:4222"
          - name: RABBITMQ_URL
            value: "amqp://rabbitmq.{{ .Values.global.namespace }}.svc.cluster.local:5672"
          - name: QDRANT_URL
            value: "http://qdrant.{{ .Values.global.namespace }}.svc.cluster.local:6333"
          - name: CLICKHOUSE_URL
            value: "http://clickhouse.{{ .Values.global.namespace }}.svc.cluster.local:8123"
          - name: INFLUXDB_URL
            value: "http://influxdb.{{ .Values.global.namespace }}.svc.cluster.local:8086"
          {{- if .Values.rayCluster.env.openaiApiKey }}
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: ai-platform-secrets
                key: openai-api-key
                optional: true
          {{- end }}
          {{- if .Values.rayCluster.env.anthropicApiKey }}
          - name: ANTHROPIC_API_KEY
            valueFrom:
              secretKeyRef:
                name: ai-platform-secrets
                key: anthropic-api-key
                optional: true
          {{- end }}
          volumeMounts:
          - name: log-volume
            mountPath: /tmp/ray
        volumes:
        - name: log-volume
          emptyDir: {}
{{- end }}