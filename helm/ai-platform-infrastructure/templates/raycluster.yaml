{{- if index .Values "kuberay-operator" "enabled" }}
---
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-cluster-dev
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: ray
    app.kubernetes.io/component: cluster
    app.kubernetes.io/part-of: ai-platform
spec:
  # Ray version
  rayVersion: '2.50.0'
  
  # Head node configuration
  headGroupSpec:
    serviceType: ClusterIP
    rayStartParams:
      dashboard-host: '0.0.0.0'
      port: '6379'
      num-cpus: '{{ .Values.rayCluster.head.numCpus }}'
      block: 'true'
    template:
      spec:
        serviceAccountName: ray-serviceaccount
        containers:
        - name: ray-head
          image: {{ .Values.rayCluster.head.image.repository }}:{{ .Values.rayCluster.head.image.tag }}
          imagePullPolicy: {{ .Values.rayCluster.head.image.pullPolicy }}
          ports:
          - containerPort: 10001
            name: client
          - containerPort: 6379
            name: gcs
          - containerPort: 8265
            name: dashboard
          - containerPort: 8080
            name: metrics
          resources:
            {{- toYaml .Values.rayCluster.head.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/gcs_healthz
              port: 8265
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/gcs_healthz
              port: 8265
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/gcs_healthz
              port: 8265
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          env:
          - name: PYTHONPATH
            value: "/app/src:/app"
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: postgresql-secret
                key: DATABASE_URL
          - name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: redis-secret
                key: REDIS_URL
          - name: NATS_URL
            value: "nats://nats.{{ .Values.global.namespace }}.svc.cluster.local:4222"
          - name: RABBITMQ_URL
            value: "amqp://rabbitmq.{{ .Values.global.namespace }}.svc.cluster.local:5672"
          - name: QDRANT_URL
            value: "http://qdrant.{{ .Values.global.namespace }}.svc.cluster.local:6333"
          - name: CLICKHOUSE_URL
            value: "http://clickhouse.{{ .Values.global.namespace }}.svc.cluster.local:8123"
          - name: INFLUXDB_URL
            value: "http://influxdb.{{ .Values.global.namespace }}.svc.cluster.local:8086"
          {{- if .Values.rayCluster.env.openaiApiKey }}
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: ai-platform-secrets
                key: openai-api-key
                optional: true
          {{- end }}
          {{- if .Values.rayCluster.env.anthropicApiKey }}
          - name: ANTHROPIC_API_KEY
            valueFrom:
              secretKeyRef:
                name: ai-platform-secrets
                key: anthropic-api-key
                optional: true
          {{- end }}
          volumeMounts:
          - name: log-volume
            mountPath: /tmp/ray
          - name: shared-mem
            mountPath: /dev/shm
        volumes:
        - name: log-volume
          emptyDir:
            sizeLimit: 2Gi
        - name: shared-mem
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
        nodeSelector:
          kubernetes.io/arch: amd64
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                    - cluster
                topologyKey: kubernetes.io/hostname
  
  # Worker nodes configuration
  workerGroupSpecs:
  - replicas: {{ .Values.rayCluster.worker.replicas }}
    minReplicas: {{ .Values.rayCluster.worker.minReplicas }}
    maxReplicas: {{ .Values.rayCluster.worker.maxReplicas }}
    groupName: worker-group
    rayStartParams:
      num-cpus: '{{ .Values.rayCluster.worker.numCpus }}'
      block: 'true'
    template:
      spec:
        serviceAccountName: ray-serviceaccount
        containers:
        - name: ray-worker
          image: {{ .Values.rayCluster.worker.image.repository }}:{{ .Values.rayCluster.worker.image.tag }}
          imagePullPolicy: {{ .Values.rayCluster.worker.image.pullPolicy }}
          ports:
          - containerPort: 6379
            name: gcs-server
          - containerPort: 8000
            name: serve
          - containerPort: 10001
            name: client
          resources:
            {{- toYaml .Values.rayCluster.worker.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
              - python
              - -c
              - |
                import ray
                try:
                    ray.init("ray://ray-cluster-dev-head-svc.{{ .Values.global.namespace }}.svc.cluster.local:10001", ignore_reinit_error=True)
                    print("Ray worker healthy")
                    ray.shutdown()
                except Exception as e:
                    print(f"Ray worker unhealthy: {e}")
                    exit(1)
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
              - python
              - -c
              - |
                import ray
                try:
                    ray.init("ray://ray-cluster-dev-head-svc.{{ .Values.global.namespace }}.svc.cluster.local:10001", ignore_reinit_error=True)
                    print("Ray worker ready")
                    ray.shutdown()
                except Exception as e:
                    print(f"Ray worker not ready: {e}")
                    exit(1)
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe:
            exec:
              command:
              - python
              - -c
              - |
                import ray
                try:
                    ray.init("ray://ray-cluster-dev-head-svc.{{ .Values.global.namespace }}.svc.cluster.local:10001", ignore_reinit_error=True)
                    print("Ray worker starting")
                    ray.shutdown()
                except Exception as e:
                    print(f"Ray worker startup check: {e}")
                    exit(1)
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          env:
          - name: PYTHONPATH
            value: "/app/src:/app"
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: postgresql-secret
                key: DATABASE_URL
          - name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: redis-secret
                key: REDIS_URL
          - name: NATS_URL
            value: "nats://nats.{{ .Values.global.namespace }}.svc.cluster.local:4222"
          - name: RABBITMQ_URL
            value: "amqp://rabbitmq.{{ .Values.global.namespace }}.svc.cluster.local:5672"
          - name: QDRANT_URL
            value: "http://qdrant.{{ .Values.global.namespace }}.svc.cluster.local:6333"
          - name: CLICKHOUSE_URL
            value: "http://clickhouse.{{ .Values.global.namespace }}.svc.cluster.local:8123"
          - name: INFLUXDB_URL
            value: "http://influxdb.{{ .Values.global.namespace }}.svc.cluster.local:8086"
          {{- if .Values.rayCluster.env.openaiApiKey }}
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: ai-platform-secrets
                key: openai-api-key
                optional: true
          {{- end }}
          {{- if .Values.rayCluster.env.anthropicApiKey }}
          - name: ANTHROPIC_API_KEY
            valueFrom:
              secretKeyRef:
                name: ai-platform-secrets
                key: anthropic-api-key
                optional: true
          {{- end }}
          volumeMounts:
          - name: log-volume
            mountPath: /tmp/ray
          - name: shared-mem
            mountPath: /dev/shm
        volumes:
        - name: log-volume
          emptyDir:
            sizeLimit: 1Gi
        - name: shared-mem
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
        nodeSelector:
          kubernetes.io/arch: amd64
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                    - worker
                topologyKey: kubernetes.io/hostname
{{- end }}