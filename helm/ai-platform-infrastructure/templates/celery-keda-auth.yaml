{{- if and .Values.keda.enabled .Values.celery.worker.enabled .Values.celery.worker.autoscaling.enabled }}
{{- if eq .Values.celery.broker "rabbitmq" }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "ai-platform.fullname" . }}-celery-rabbitmq-auth
  namespace: {{ .Values.global.namespace }}
spec:
  secretTargetRef:
  - parameter: host
    name: {{ include "ai-platform.fullname" . }}-secrets
    key: rabbitmq-host
  - parameter: username
    name: {{ include "ai-platform.fullname" . }}-secrets
    key: rabbitmq-username
  - parameter: password
    name: {{ include "ai-platform.fullname" . }}-secrets
    key: rabbitmq-password
{{- else if eq .Values.celery.broker "redis" }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "ai-platform.fullname" . }}-celery-redis-auth
  namespace: {{ .Values.global.namespace }}
spec:
  secretTargetRef:
  - parameter: address
    name: {{ include "ai-platform.fullname" . }}-secrets
    key: redis-host
  - parameter: password
    name: {{ include "ai-platform.fullname" . }}-secrets
    key: redis-password
{{- end }}
{{- end }}