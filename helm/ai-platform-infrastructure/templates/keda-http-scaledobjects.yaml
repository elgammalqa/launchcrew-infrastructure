{{- if .Values.keda.httpAddOn.enabled }}
---
# Registry - HTTP traffic based scale-to-zero
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: {{ include "ai-platform.fullname" . }}-registry-http
  namespace: {{ .Values.global.namespace }}
spec:
  hosts:
  - registry.{{ .Values.global.namespace }}.svc.cluster.local
  - registry.local
  targetPendingRequests: 100
  scaledownPeriod: 300
  scaleTargetRef:
    name: {{ include "ai-platform.fullname" . }}-registry
    kind: Deployment
    apiVersion: apps/v1
    service: registry
    port: 5000
  replicas:
    min: 0
    max: 3
