{{- if and .Values.rayCluster .Values.rayCluster.enabled }}
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: {{ .Values.rayCluster.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: ray-cluster
spec:
  rayVersion: '2.9.0'
  enableInTreeAutoscaling: false
  headGroupSpec:
    rayStartParams:
      dashboard-host: {{ index .Values.rayCluster.head.rayStartParams "dashboard-host" | quote }}
      memory: {{ .Values.rayCluster.head.rayStartParams.memory | quote }}
      num-cpus: {{ index .Values.rayCluster.head.rayStartParams "num-cpus" | quote }}
      block: 'true'
    template:
      spec:
        containers:
        - name: ray-head
          image: rayproject/ray:2.9.0
          resources:
            {{- toYaml .Values.rayCluster.head.resources | nindent 12 }}
          ports:
          - containerPort: 6379
            name: gcs-server
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
          readinessProbe:
            httpGet:
              path: /api/gcs_healthz
              port: 8265
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/gcs_healthz
              port: 8265
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
          - mountPath: /tmp/ray
            name: log-volume
          - mountPath: /dev/shm
            name: shared-mem
          readinessProbe:
            httpGet:
              path: /api/gcs_healthz
              port: 8265
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/gcs_healthz
              port: 8265
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
        volumes:
        - name: log-volume
          emptyDir: {}
        - name: shared-mem
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  workerGroupSpecs:
  {{- if gt (.Values.rayCluster.worker.replicas | int) 0 }}
  - replicas: {{ .Values.rayCluster.worker.replicas }}
    minReplicas: 0
    maxReplicas: {{ .Values.rayCluster.worker.replicas }}
    groupName: worker-group
    rayStartParams:
      block: 'true'
    template:
      spec:
        containers:
        - name: ray-worker
          image: rayproject/ray:2.9.0
          resources:
            {{- toYaml .Values.rayCluster.worker.resources | nindent 12 }}
          volumeMounts:
          - mountPath: /tmp/ray
            name: log-volume
          - mountPath: /dev/shm
            name: shared-mem
        volumes:
        - name: log-volume
          emptyDir: {}
        - name: shared-mem
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
  {{- end }}
{{- end }}
