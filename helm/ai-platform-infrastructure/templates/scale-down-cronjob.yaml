{{- if .Values.autoScaling.enabled }}
---
# ServiceAccount for scaling operations
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infrastructure-scaler
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
---
# Role with permissions to scale resources
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infrastructure-scaler
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "patch", "update"]
- apiGroups: ["apps"]
  resources: ["deployments/scale", "statefulsets/scale"]
  verbs: ["get", "update", "patch"]
---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infrastructure-scaler
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infrastructure-scaler
subjects:
- kind: ServiceAccount
  name: infrastructure-scaler
  namespace: {{ .Values.global.namespace }}
---
# CronJob to scale DOWN infrastructure (outside working hours)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scale-down-infrastructure
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: auto-scaler
spec:
  schedule: "{{ .Values.autoScaling.scaleDown.schedule }}"
  timeZone: "{{ .Values.autoScaling.timezone }}"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "ai-platform.labels" . | nindent 12 }}
            component: auto-scaler
            operation: scale-down
        spec:
          serviceAccountName: infrastructure-scaler
          restartPolicy: OnFailure
          containers:
          - name: scaler
            image: bitnami/kubectl:latest
            imagePullPolicy: IfNotPresent
            resources:
              requests:
                memory: "64Mi"
                cpu: "50m"
              limits:
                memory: "128Mi"
                cpu: "100m"
            command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "🌙 Scaling down infrastructure at $(date)"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              
              NAMESPACE="{{ .Values.global.namespace }}"
              
              # Scale down StatefulSets
              echo "📉 Scaling down StatefulSets..."
              {{- if and .Values.simpleServices.postgresql .Values.simpleServices.postgresql.enabled }}
              kubectl scale statefulset {{ include "ai-platform.fullname" . }}-postgresql -n $NAMESPACE --replicas=0 || true
              echo "  ✓ PostgreSQL scaled to 0"
              {{- end }}
              {{- if and .Values.simpleServices.redis .Values.simpleServices.redis.enabled }}
              kubectl scale statefulset {{ include "ai-platform.fullname" . }}-redis -n $NAMESPACE --replicas=0 || true
              echo "  ✓ Redis scaled to 0"
              {{- end }}
              {{- if and .Values.simpleServices.qdrant .Values.simpleServices.qdrant.enabled }}
              kubectl scale statefulset {{ include "ai-platform.fullname" . }}-qdrant -n $NAMESPACE --replicas=0 || true
              echo "  ✓ Qdrant scaled to 0"
              {{- end }}
              
              # Scale down Deployments (KEDA will handle these, but we do it explicitly for safety)
              echo "📉 Scaling down Deployments..."
              {{- if and .Values.simpleServices.rabbitmq .Values.simpleServices.rabbitmq.enabled }}
              kubectl scale deployment {{ include "ai-platform.fullname" . }}-rabbitmq -n $NAMESPACE --replicas=0 || true
              echo "  ✓ RabbitMQ scaled to 0"
              {{- end }}
              {{- if and .Values.simpleServices.nats .Values.simpleServices.nats.enabled }}
              kubectl scale deployment {{ include "ai-platform.fullname" . }}-nats -n $NAMESPACE --replicas=0 || true
              echo "  ✓ NATS scaled to 0"
              {{- end }}
              {{- if and .Values.simpleServices.clickhouse .Values.simpleServices.clickhouse.enabled }}
              kubectl scale deployment {{ include "ai-platform.fullname" . }}-clickhouse -n $NAMESPACE --replicas=0 || true
              echo "  ✓ ClickHouse scaled to 0"
              {{- end }}
              {{- if and .Values.simpleServices.influxdb .Values.simpleServices.influxdb.enabled }}
              kubectl scale deployment {{ include "ai-platform.fullname" . }}-influxdb -n $NAMESPACE --replicas=0 || true
              echo "  ✓ InfluxDB scaled to 0"
              {{- end }}
              {{- if index .Values "kuberay-operator" "enabled" }}
              kubectl scale deployment kuberay-operator -n $NAMESPACE --replicas=0 || true
              echo "  ✓ KubeRay Operator scaled to 0"
              {{- end }}
              
              echo ""
              echo "✅ Infrastructure scaled down successfully"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
---
# CronJob to scale UP infrastructure (working hours)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scale-up-infrastructure
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: auto-scaler
spec:
  schedule: "{{ .Values.autoScaling.scaleUp.schedule }}"
  timeZone: "{{ .Values.autoScaling.timezone }}"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "ai-platform.labels" . | nindent 12 }}
            component: auto-scaler
            operation: scale-up
        spec:
          serviceAccountName: infrastructure-scaler
          restartPolicy: OnFailure
          containers:
          - name: scaler
            image: bitnami/kubectl:latest
            imagePullPolicy: IfNotPresent
            resources:
              requests:
                memory: "64Mi"
                cpu: "50m"
              limits:
                memory: "128Mi"
                cpu: "100m"
            command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "☀️ Scaling up infrastructure at $(date)"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              
              NAMESPACE="{{ .Values.global.namespace }}"
              
              # Scale up StatefulSets
              echo "📈 Scaling up StatefulSets..."
              {{- if and .Values.simpleServices.postgresql .Values.simpleServices.postgresql.enabled }}
              kubectl scale statefulset {{ include "ai-platform.fullname" . }}-postgresql -n $NAMESPACE --replicas=1 || true
              echo "  ✓ PostgreSQL scaled to 1"
              {{- end }}
              {{- if and .Values.simpleServices.redis .Values.simpleServices.redis.enabled }}
              kubectl scale statefulset {{ include "ai-platform.fullname" . }}-redis -n $NAMESPACE --replicas=1 || true
              echo "  ✓ Redis scaled to 1"
              {{- end }}
              {{- if and .Values.simpleServices.qdrant .Values.simpleServices.qdrant.enabled }}
              kubectl scale statefulset {{ include "ai-platform.fullname" . }}-qdrant -n $NAMESPACE --replicas=1 || true
              echo "  ✓ Qdrant scaled to 1"
              {{- end }}
              
              # Scale up Deployments (KEDA will handle these, but we do it explicitly for safety)
              echo "📈 Scaling up Deployments..."
              {{- if and .Values.simpleServices.rabbitmq .Values.simpleServices.rabbitmq.enabled }}
              kubectl scale deployment {{ include "ai-platform.fullname" . }}-rabbitmq -n $NAMESPACE --replicas=1 || true
              echo "  ✓ RabbitMQ scaled to 1"
              {{- end }}
              {{- if and .Values.simpleServices.nats .Values.simpleServices.nats.enabled }}
              kubectl scale deployment {{ include "ai-platform.fullname" . }}-nats -n $NAMESPACE --replicas=1 || true
              echo "  ✓ NATS scaled to 1"
              {{- end }}
              {{- if and .Values.simpleServices.clickhouse .Values.simpleServices.clickhouse.enabled }}
              kubectl scale deployment {{ include "ai-platform.fullname" . }}-clickhouse -n $NAMESPACE --replicas=1 || true
              echo "  ✓ ClickHouse scaled to 1"
              {{- end }}
              {{- if and .Values.simpleServices.influxdb .Values.simpleServices.influxdb.enabled }}
              kubectl scale deployment {{ include "ai-platform.fullname" . }}-influxdb -n $NAMESPACE --replicas=1 || true
              echo "  ✓ InfluxDB scaled to 1"
              {{- end }}
              {{- if index .Values "kuberay-operator" "enabled" }}
              kubectl scale deployment kuberay-operator -n $NAMESPACE --replicas=1 || true
              echo "  ✓ KubeRay Operator scaled to 1"
              {{- end }}
              
              echo ""
              echo "✅ Infrastructure scaled up successfully"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
{{- end }}
