{{- if and .Values.simpleServices (and .Values.simpleServices.weaviate .Values.simpleServices.weaviate.enabled) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ai-platform.fullname" . }}-weaviate
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: weaviate
spec:
  serviceName: weaviate
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-platform.selectorLabels" . | nindent 6 }}
      component: weaviate
  template:
    metadata:
      labels:
        {{- include "ai-platform.selectorLabels" . | nindent 8 }}
        component: weaviate
    spec:
      containers:
      - name: weaviate
        image: {{ .Values.simpleServices.weaviate.image }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.simpleServices.weaviate.port }}
          name: http
        env:
        - name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
          value: "true"
        - name: AUTHENTICATION_APIKEY_ENABLED
          value: "false"
        - name: PERSISTENCE_DATA_PATH
          value: "/var/lib/weaviate"
        - name: DEFAULT_VECTORIZER_MODULE
          value: "none"
        - name: ENABLE_MODULES
          value: ""
        - name: CLUSTER_HOSTNAME
          value: "node1"
        resources:
          {{- toYaml .Values.simpleServices.weaviate.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /v1/.well-known/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/.well-known/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /var/lib/weaviate
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        {{- include "ai-platform.labels" . | nindent 8 }}
        component: weaviate
    spec:
      accessModes:
        - {{ .Values.persistence.weaviate.accessMode }}
      resources:
        requests:
          storage: {{ .Values.persistence.weaviate.size }}
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: weaviate
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: weaviate
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.simpleServices.weaviate.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "ai-platform.selectorLabels" . | nindent 4 }}
    component: weaviate
{{- end }}