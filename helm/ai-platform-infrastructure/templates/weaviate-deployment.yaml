{{- if .Values.weaviate.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-platform.fullname" . }}-weaviate
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: weaviate
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-platform.selectorLabels" . | nindent 6 }}
      component: weaviate
  template:
    metadata:
      labels:
        {{- include "ai-platform.selectorLabels" . | nindent 8 }}
        component: weaviate
    spec:
      containers:
      - name: weaviate
        image: "{{ .Values.weaviate.image.registry }}/{{ .Values.weaviate.image.repository }}:{{ .Values.weaviate.image.tag }}"
        imagePullPolicy: {{ .Values.weaviate.image.pullPolicy }}
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: QUERY_DEFAULTS_LIMIT
          value: "25"
        - name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
          value: "{{ .Values.weaviate.authentication.anonymous_access.enabled }}"
        - name: PERSISTENCE_DATA_PATH
          value: /var/lib/weaviate
        - name: DEFAULT_VECTORIZER_MODULE
          value: none
        - name: ENABLE_MODULES
          value: ""
        - name: CLUSTER_HOSTNAME
          value: node1
        volumeMounts:
        - name: weaviate-data
          mountPath: /var/lib/weaviate
        resources:
          {{- toYaml .Values.weaviate.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /v1/.well-known/live
            port: http
          initialDelaySeconds: 120
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/.well-known/ready
            port: http
          initialDelaySeconds: 3
          periodSeconds: 3
      volumes:
      - name: weaviate-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-platform.fullname" . }}-weaviate
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    component: weaviate
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "ai-platform.selectorLabels" . | nindent 4 }}
    component: weaviate
{{- end }}