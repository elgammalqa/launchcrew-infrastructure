apiVersion: v2
name: ai-platform
description: AI Platform Infrastructure Components
type: application
version: 0.1.0
appVersion: "1.0"

dependencies:
  # PostgreSQL - Bitnami chart
  - name: postgresql
    version: "15.5.32"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
    
  # Redis - Bitnami chart
  - name: redis
    version: "20.1.7"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
    
  # RabbitMQ - Bitnami chart
  - name: rabbitmq
    version: "14.6.6"
    repository: "https://charts.bitnami.com/bitnami"
    condition: rabbitmq.enabled
    
  # NATS - Official NATS chart
  - name: nats
    version: "1.2.2"
    repository: "https://nats-io.github.io/k8s/helm/charts/"
    condition: nats.enabled
    
  # ClickHouse - Bitnami chart
  - name: clickhouse
    version: "6.2.17"
    repository: "https://charts.bitnami.com/bitnami"
    condition: clickhouse.enabled
    
  # Weaviate - Official Weaviate chart
  - name: weaviate
    version: "16.8.5"
    repository: "https://weaviate.github.io/weaviate-helm"
    condition: weaviate.enabled
    
  # InfluxDB - Official InfluxDB chart
  - name: influxdb2
    version: "2.1.2"
    repository: "https://helm.influxdata.com/"
    condition: influxdb2.enabled
    
  # KubeRay Operator - Official Ray Project chart for distributed computing
  - name: kuberay-operator
    version: "1.4.2"
    repository: "https://ray-project.github.io/kuberay-helm/"
    condition: kuberay-operator.enabled
    alias: kuberay

maintainers:
  - name: DevOps Team
    email: devops@company.com

keywords:
  - infrastructure
  - database
  - message-queue
  - cache
  - analytics
  - vector-database
  - distributed-computing
  - ray