steps:
  # Build Ray Head image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'docker/ray-head.dockerfile'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-ray-head:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-ray-head:latest'
      - '.'
    id: 'build-ray-head'
    timeout: '1200s'

  # Build Ray Worker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'docker/ray-worker.dockerfile'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-ray-worker:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-ray-worker:latest'
      - '.'
    id: 'build-ray-worker'
    timeout: '1200s'

  # Push Ray Head images
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ai-ray-head:$BUILD_ID'
    id: 'push-head-sha'
    waitFor: ['build-ray-head']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ai-ray-head:latest'
    id: 'push-head-latest'
    waitFor: ['build-ray-head']

  # Push Ray Worker images
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ai-ray-worker:$BUILD_ID'
    id: 'push-worker-sha'
    waitFor: ['build-ray-worker']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ai-ray-worker:latest'
    id: 'push-worker-latest'
    waitFor: ['build-ray-worker']

  # Test Ray Head image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'run'
      - '--rm'
      - 'gcr.io/$PROJECT_ID/ai-ray-head:$BUILD_ID'
      - 'python'
      - '-c'
      - 'import ray; import numpy; import fastapi; import sqlalchemy; print("✅ Ray Head - All imports successful"); print(f"Ray: {ray.__version__}"); print(f"NumPy: {numpy.__version__}"); print(f"FastAPI: {fastapi.__version__}"); print(f"SQLAlchemy: {sqlalchemy.__version__}")'
    id: 'test-ray-head'
    waitFor: ['push-head-sha']

  # Test Ray Worker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'run'
      - '--rm'
      - 'gcr.io/$PROJECT_ID/ai-ray-worker:$BUILD_ID'
      - 'python'
      - '-c'
      - 'import ray; import numpy; import fastapi; import sqlalchemy; print("✅ Ray Worker - All imports successful"); print(f"Ray: {ray.__version__}"); print(f"NumPy: {numpy.__version__}"); print(f"FastAPI: {fastapi.__version__}"); print(f"SQLAlchemy: {sqlalchemy.__version__}")'
    id: 'test-ray-worker'
    waitFor: ['push-worker-sha']

  # Security scan Ray Head image
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud container images scan gcr.io/$PROJECT_ID/ai-ray-head:$BUILD_ID \
          --format='value(response.scan.analysisCompleted)' || echo "Ray Head security scan initiated"
    id: 'scan-ray-head'
    waitFor: ['push-head-sha']

  # Security scan Ray Worker image
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud container images scan gcr.io/$PROJECT_ID/ai-ray-worker:$BUILD_ID \
          --format='value(response.scan.analysisCompleted)' || echo "Ray Worker security scan initiated"
    id: 'scan-ray-worker'
    waitFor: ['push-worker-sha']

images:
  - 'gcr.io/$PROJECT_ID/ai-ray-head:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/ai-ray-head:latest'
  - 'gcr.io/$PROJECT_ID/ai-ray-worker:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/ai-ray-worker:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '2400s'

# Tags for organizing builds
tags:
  - 'ray-head'
  - 'ray-worker'
  - 'ai-platform'
  - 'distributed-computing'
