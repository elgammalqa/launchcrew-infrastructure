apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: launchcrew-auth-service
  namespace: ai-platform-auth
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/rate-limit: '100'
    nginx.ingress.kubernetes.io/rate-limit-window: '1m'
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
  labels:
    ai-platform.io/environment: production
    ai-platform.io/service: auth
    ai-platform.io/tier: backend
    app.kubernetes.io/component: authentication
    app.kubernetes.io/name: launchcrew-auth-service
    app.kubernetes.io/part-of: ai-platform
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - auth.flwcre.com
      secretName: auth-flwcre-tls
  rules:
    - host: auth.flwcre.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: launchcrew-auth-service
                port:
                  number: 3000
